name: Deploy Apps to Cloud Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: "選擇部署的服務"
        required: true
        default: all
        type: choice
        options:
          - all
          - price-listener
          - price-analyzer
          - price-broadcaster

# WIF 驗證需要讀取 OIDC ID Token 的權限
permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  REPOSITORY: apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 設定 Docker 對 Artifact Registry 的認證
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: 確保 Artifact Registry repository 存在
        run: |
          gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --location="${{ env.REGION }}" \
            || gcloud artifacts repositories create "${{ env.REPOSITORY }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --location="${{ env.REGION }}" \
            --repository-format=docker

      - name: 建置並推送 price-listener
        if: ${{ inputs.target == 'all' || inputs.target == 'price-listener' }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/price-listener:${{ github.sha }}"
          docker build -f apps/price-listener/Dockerfile -t "$IMAGE" apps
          docker push "$IMAGE"

      - name: 部署 price-listener
        if: ${{ inputs.target == 'all' || inputs.target == 'price-listener' }}
        run: |
          gcloud run deploy price-listener \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/price-listener:${{ github.sha }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --no-allow-unauthenticated \
            --ingress=internal \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --memory=512Mi \
            --timeout=3600 \
            --set-env-vars=GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}",PUBSUB_TOPIC_ID=price-updates,CA_CERT_PATH=/secrets/ca.pfx \
            --set-secrets=API_KEY=shioaji-api-key:latest,SECRET_KEY=shioaji-secret-key:latest,CA_PASSWORD=shioaji-ca-password:latest,/secrets/ca.pfx=shioaji-ca-cert:latest

      - name: 建置並推送 price-analyzer
        if: ${{ inputs.target == 'all' || inputs.target == 'price-analyzer' }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/price-analyzer:${{ github.sha }}"
          docker build -f apps/price-analyzer/Dockerfile -t "$IMAGE" apps
          docker push "$IMAGE"

      - name: 部署 price-analyzer
        if: ${{ inputs.target == 'all' || inputs.target == 'price-analyzer' }}
        run: |
          gcloud run deploy price-analyzer \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/price-analyzer:${{ github.sha }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --no-allow-unauthenticated \
            --ingress=internal \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --memory=512Mi \
            --timeout=3600 \
            --set-env-vars=GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}",PUBSUB_TOPIC_ID=price-updates,PUBSUB_SUBSCRIPTION_ID_ANALYZER=price-analyzer-subscription

      - name: 建置並推送 price-broadcaster
        if: ${{ inputs.target == 'all' || inputs.target == 'price-broadcaster' }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/price-broadcaster:${{ github.sha }}"
          docker build -f apps/price-broadcaster/Dockerfile -t "$IMAGE" apps
          docker push "$IMAGE"

      - name: 部署 price-broadcaster
        if: ${{ inputs.target == 'all' || inputs.target == 'price-broadcaster' }}
        run: |
          gcloud run deploy price-broadcaster \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/price-broadcaster:${{ github.sha }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --memory=512Mi \
            --timeout=3600 \
            --set-env-vars=GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}",PUBSUB_TOPIC_ID=price-updates,PUBSUB_SUBSCRIPTION_ID_BROADCASTER=price-broadcaster-subscription
