[project]
name = "trading-calendar"
version = "0.1.0"
description = "台指期交易日、交易時段與服務啟用窗口判斷（含國定假日）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.106",
    "tzdata>=2025.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
trading_calendar = ["overrides.toml"]
