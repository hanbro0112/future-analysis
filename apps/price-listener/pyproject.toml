[project]
name = "price-listener"
version = "0.1.0"
description = "價格監聽服務 - 監聽股價並發送到 Pub/Sub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "shioaji>=1.3.3",
    "pubsub",
]

[tool.uv.scripts]
start = "python main.py"

[tool.uv.sources]
pubsub = { workspace = true }
