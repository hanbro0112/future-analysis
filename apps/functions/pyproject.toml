[project]
name = "functions"
version = "0.1.0"
description = "定時任務 Cloud Functions - 每日市場報告與籌碼快訊"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "functions-framework>=3.8.0",
    "firestore-writer",
    "google-genai>=0.1.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "google-cloud-storage>=2.18.0",
]

[tool.uv.sources]
firestore-writer = { workspace = true }
